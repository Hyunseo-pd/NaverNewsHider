<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="icon\naver.png" width="32px" />
      <span class="title">Better Naver</span>
    </header>
    <hr />
    <div id="hideControl">
      <label id="hideContent">
        <input type="checkbox" />
        <span>콘텐츠 숨기기</span>
      </label>

      <ul class="contentList">
        <li>
          <label id="hideNews">
            <input type="checkbox" />
            <span>뉴스 숨기기</span>
          </label>
        </li>
        <li>
          <label id="hideShopping">
            <input type="checkbox" />
            <span>쇼핑 숨기기</span>
          </label>
        </li>
        <li>
          <label id="hideFeed">
            <input type="checkbox" />
            <span>피드 숨기기</span>
          </label>
        </li>
      </ul>
      <label id="hideSidebar">
        <input type="checkbox" />
        <span>사이드바 숨기기</span>
      </label>
      <ul class="sidebarList">
        <li>
          <label id="hideWeather">
            <input type="checkbox" />
            <span>날씨 숨기기</span>
          </label>
        </li>
        <li>
          <label id="hideStock">
            <input type="checkbox" />
            <span>증시 숨기기</span>
          </label>
        </li>
        <li>
          <label id="hideWidget">
            <input type="checkbox" />
            <span>위젯 숨기기</span>
          </label>
        </li>
      </ul>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
